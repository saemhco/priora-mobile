# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# ─────────────────────────────────────────────────────────────────────────────
# BASE LINT SET
# very_good_analysis: strict superset of flutter_lints (200+ rules).
# https://pub.dev/packages/very_good_analysis
# ─────────────────────────────────────────────────────────────────────────────
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Pragmatic overrides: noisy or low-value diagnostics are downgraded to
  # `ignore` (same approach used in gol-manager-fl) so they neither pollute
  # the IDE nor block `flutter analyze`.
  errors:
    # Untyped API JSON responses are accessed directly throughout the UI.
    avoid_dynamic_calls: ignore
    # Flutter SDK deprecations (e.g. Radio.groupValue/onChanged) are handled
    # globally instead of with per-line ignore comments.
    deprecated_member_use: ignore
    # 80-char line limit (re-enable after a full `dart format` pass if desired).
    lines_longer_than_80_chars: ignore
    # Pure style: cascade notation is optional.
    cascade_invocations: ignore
    # Catching untyped errors (`catch (e)`) is intentional for SDK/runtime errors.
    avoid_catches_without_on_clauses: ignore
    # Fire-and-forget futures in event handlers / state updates are intentional.
    discarded_futures: ignore
    # Positional booleans are natural in simple setters.
    avoid_positional_boolean_parameters: ignore
    # Method-based state changes are fine.
    use_setters_to_change_properties: ignore
    # Allow standard ignore comments without mandatory documentation above them.
    document_ignores: ignore

  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    # Requires doc comments on every public member (too noisy).
    public_member_api_docs: false

# ─────────────────────────────────────────────────────────────────────────────
# CUSTOM RULES (dart_code_linter)
# Powerful plugin with architecture-oriented rules that enforce the rules in
# PROJECT_RULES.md:
#   - prefer-single-widget-per-file  → One widget/class per file
#   - avoid-returning-widgets        → Extract reusable widgets instead of
#                                      returning them from methods
#   - prefer-extracting-callbacks    → Reusable/extracted callbacks
# Run: `dart run dart_code_linter:metrics analyze lib`
# https://pub.dev/packages/dart_code_linter
# ─────────────────────────────────────────────────────────────────────────────
dart_code_linter:
  rules:
    # ── Architecture / PROJECT_RULES.md ─────────────────────────────────
    - prefer-single-widget-per-file:
        ignore-private-widgets: true
    - avoid-returning-widgets
    - prefer-extracting-callbacks
    # ── Type safety & clean code ────────────────────────────────────────
    - avoid-dynamic
    - avoid-non-null-assertion
    - avoid-unnecessary-type-casts
    - avoid-unnecessary-conditionals
    - avoid-unused-parameters
    - avoid-unnecessary-setstate
    - use-setstate-synchronously
    - no-boolean-literal-compare
    - no-empty-block
    - no-equal-then-else
    - prefer-immediate-return
    - prefer-using-list-view
    # ── Disabled: pure-style rules, too noisy for this codebase ─────────
    # newline-before-return     (blank line before `return`)
    # prefer-moving-to-variable (repeated expressions → variable)
    # avoid-nested-conditional-expressions
    # prefer-conditional-expressions
    # prefer-trailing-comma     (already enforced by `dart format`)
