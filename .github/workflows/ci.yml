name: CI

# Mirrors the CI setup proven in gol-manager-fl: lightweight, fast, and
# pragmatic. Infos do not block, only errors and warnings do.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prepare environment file
        # `.env` is gitignored (local secrets) but is declared as an asset in
        # pubspec.yaml, so the analyzer warns when the file is missing in CI.
        # Copy the committed example; the app falls back to default values
        # when variables are empty.
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Check pending auto-fixes
        # Ensures contributors ran `dart fix --apply` locally.
        # Exits non-zero when fixes are available.
        run: dart fix --dry-run

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run tests
        run: flutter test
